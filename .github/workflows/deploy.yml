name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/frosted-cranberry' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets and variables
        run: |
          missing=0
          for name in VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_HOST VPS_USER SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret or variable $name"
              missing=1
            fi
          done
          case "$DEPLOY_PATH" in
            /*[!A-Za-z0-9_./-]*|"") echo "::error::Invalid VPS_DEPLOY_PATH"; missing=1 ;;
          esac
          exit $missing
      - name: Build
        run: npm run build
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Stage site
        run: |
          mkdir -p stage/site stage/deploy
          cp -r index.html robots.txt sitemap.xml checkout assets stage/site/
          cp Dockerfile docker-compose.prod.yml .dockerignore stage/
          cp deploy/nginx.conf stage/deploy/
      - name: Sync to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            --rsync-path="mkdir -p '$DEPLOY_PATH' && rsync" \
            stage/ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"
      - name: Build and restart container
        run: |
          SITE_HOST="${SITE_URL#https://}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && SITE_HOST='$SITE_HOST' docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${SITE_URL}/" -o /dev/null
          curl --fail --silent --show-error "${SITE_URL}/checkout?bundle=best" -o /dev/null
