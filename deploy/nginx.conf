server {
  listen 80;
  server_name frosted-cranberry.72-60-247-32.sslip.io;
  return 301 https://frosted-cranberry.brunodev.store$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  include /etc/nginx/security-headers.conf;

  location /assets/img/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
  }

  location = /checkout {
    include /etc/nginx/security-headers.conf;
    try_files /checkout/index.html =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ =404;
  }
}
